<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenChess — free chess with a built-in coach</title>
  <meta name="description" content="Free, open-source chess. No sign-up. Play the computer or people online, then get an engine-backed review and coaching after every game.">
  <meta name="theme-color" content="#161512">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/chessground.base.css">
  <link rel="stylesheet" href="/vendor/chessground.cburnett.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="OpenChess home"><span class="logo" aria-hidden="true">♞</span> OpenChess</a>
    <nav aria-label="Main">
      <a href="#/play" data-nav="play">Play</a>
      <a href="#/history" data-nav="history">Games</a>
      <a href="#/train" data-nav="train">Train</a>
      <a href="#/profile" data-nav="profile">Profile</a>
    </nav>
    <span class="online" id="online-count" title="Players connected right now"></span>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    Free &amp; open source (GPL-3.0). No accounts, no ads. Your games and ratings stay in this browser.
    <a href="#/about">About</a>
  </footer>
  <noscript><p style="padding:2rem">OpenChess needs JavaScript to run the board and engine.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
