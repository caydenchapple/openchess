<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenChess — free chess with a built-in coach</title>
  <meta name="description" content="Free, open-source chess. No sign-up. Play the computer or people online, then get an engine-backed review and coaching after every game.">
  <meta name="theme-color" content="#161512">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/chessground.base.css">
  <link rel="stylesheet" href="/vendor/chessground.cburnett.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="OpenChess home"><img class="logo" src="/logo.svg" alt="" width="32" height="32"> OpenChess</a>
    <nav aria-label="Main">
      <a href="#/play" data-nav="play">Play</a>
      <a href="#/learn" data-nav="learn">Learn</a>
      <a href="#/friends" data-nav="friends">Friends<span class="nbadge" id="friends-badge" hidden></span></a>
      <a href="#/history" data-nav="history">My games</a>
      <a href="#/profile" data-nav="profile">My progress</a>
    </nav>
    <a class="streak" id="streak-chip" href="#/learn" hidden></a>
    <a class="me" id="me-chip" href="#/profile" aria-label="My profile" title="My profile"></a>
    
    <button type="button" id="howto-btn" class="help" aria-label="How to play" title="How to play">?</button>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    Free &amp; open source (GPL-3.0). No accounts, no ads. Your games and ratings stay in this browser.
    <a href="#/about">About</a>
  </footer>
  <noscript><p style="padding:2rem">OpenChess needs JavaScript to run the board and engine.</p></noscript>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
