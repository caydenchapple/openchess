  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#0d2005" stop-opacity="0"/><stop offset="1" stop-color="#0d2005" stop-opacity=".55"/></radialGradient>
  <linearGradient id="horse" x1="0" y1="0" x2="1" y2=".9"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f3eddb"/><stop offset="1" stop-color="#c9bf9f"/></linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset=".25" stop-color="#4a3b17" stop-opacity="0"/><stop offset="1" stop-color="#4a3b17" stop-opacity=".5"/></linearGradient>
