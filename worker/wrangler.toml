name = "openchess-rooms"
main = "index.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "InboxDO"

[[durable_objects.bindings]]
name = "SCORES"
class_name = "ScoresDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InboxDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ScoresDO"]

[vars]
# extra origins (besides *.pages.dev and localhost) that may open room connections, comma separated
ALLOWED_ORIGINS = ""
